<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maximus Display</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07080c;color:#c8d0dc;font-family:'SF Mono',Menlo,Consolas,monospace;overflow:hidden}
  body{display:flex;flex-direction:column;padding:24px;gap:18px}

  #topbar{display:flex;justify-content:space-between;align-items:center}
  #titulo{font-size:14px;letter-spacing:3px;color:#4d5566;font-weight:600}
  #reloj{font-size:15px;color:#4d5566;letter-spacing:1px}

  #estado{
    align-self:center;padding:6px 18px;border-radius:20px;font-size:12px;
    letter-spacing:3px;font-weight:700;border:1px solid #232838;
    background:rgba(14,17,24,.9);transition:all .3s ease;
  }
  #estado.escuchando{border-color:#4a9eff;color:#4a9eff}
  #estado.pensando{border-color:#f5a623;color:#f5a623}
  #estado.ejecutando{border-color:#c77dff;color:#c77dff}
  #estado.respondiendo{border-color:#50e3c2;color:#50e3c2}
  #estado.hablando{border-color:#50e3c2;color:#50e3c2}
  #estado.espera{border-color:#232838;color:#4d5566}
  #estado.offline{border-color:#ff5f56;color:#ff5f56}

  #centro{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  #orbe{
    width:320px;height:320px;border-radius:50%;
    border:3px solid #232838;position:relative;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .3s ease, box-shadow .3s ease;
    overflow:hidden;
  }
  #orbe::before{
    content:'';position:absolute;inset:-24px;border-radius:50%;
    border:1px dashed #1a1e28;animation:girar 30s linear infinite;
  }
  #foto{width:100%;height:100%;object-fit:cover;border-radius:50%;filter:saturate(.9);transition:transform .06s ease-out}

  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(80,227,194,.35)}50%{box-shadow:0 0 0 24px rgba(80,227,194,0)}}
  @keyframes girar{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  .escuchando #orbe{border-color:#4a9eff;box-shadow:0 0 40px rgba(74,158,255,.5)}
  .pensando #orbe{border-color:#f5a623;box-shadow:0 0 40px rgba(245,166,35,.5);animation:pulso 1.4s ease-in-out infinite}
  .ejecutando #orbe{border-color:#c77dff;box-shadow:0 0 40px rgba(199,125,255,.5)}
  .respondiendo #orbe{border-color:#50e3c2;box-shadow:0 0 40px rgba(80,227,194,.5)}
  .hablando #orbe{border-color:#50e3c2;box-shadow:0 0 40px rgba(80,227,194,.5)}

  #detalle{max-width:640px;text-align:center;font-size:14px;color:#8b93a3;min-height:20px}

  #btnMic{
    align-self:center;width:64px;height:64px;border-radius:50%;
    background:rgba(14,17,24,.94);border:2px solid #232838;color:#4d5566;
    font-size:26px;cursor:pointer;transition:all .2s ease;
  }
  #btnMic:hover{border-color:#4a9eff;color:#4a9eff}
  #btnMic.grabando{border-color:#ff5f56;color:#ff5f56;animation:pulso 1s ease-in-out infinite}
  #herramienta{font-size:12px;color:#c77dff;letter-spacing:1px;min-height:16px}

  #panel{display:flex;gap:18px}
  .caja{
    flex:1;background:rgba(14,17,24,.9);border:1px solid #232838;border-radius:10px;
    padding:14px 16px;max-height:180px;overflow:hidden;
  }
  .caja h3{font-size:10px;letter-spacing:2px;color:#4d5566;margin-bottom:8px}
  #log{font-size:12px;line-height:1.6;color:#6b7386}
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #conexiones{display:flex;flex-direction:column;gap:6px;font-size:12px}
  .conex{display:flex;justify-content:space-between}
  .conex .punto{width:8px;height:8px;border-radius:50%;background:#4d5566;display:inline-block;margin-right:6px}
</style>
</head>
<body class="espera">

  <div id="topbar">
    <div id="titulo">MAXIMUS DISPLAY</div>
    <div id="reloj"></div>
  </div>

  <div id="estado" class="espera">EN ESPERA</div>

  <div id="centro">
    <div id="orbe"><img id="foto" src="/maximus/foto" alt="Maximus"></div>
  </div>

  <div id="herramienta"></div>
  <div id="detalle">Conectando…</div>

  <button id="btnMic" title="Hablarle a Maximus">🎤</button>

  <div id="panel">
    <div class="caja">
      <h3>ACTIVIDAD RECIENTE</h3>
      <div id="log"></div>
    </div>
    <div class="caja">
      <h3>CONEXIONES</h3>
      <div id="conexiones">
        <div class="conex"><span><span class="punto"></span>DiMangoToGo</span><span>—</span></div>
        <div class="conex"><span><span class="punto"></span>DiMangoWorking</span><span>—</span></div>
        <div class="conex"><span><span class="punto"></span>Telegram</span><span>—</span></div>
        <div class="conex"><span><span class="punto"></span>Base de datos</span><span>—</span></div>
      </div>
    </div>
  </div>

<script>
// Token por URL: http://IP:PUERTO/maximus/display?token=XXXX
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';

const body = document.body;
const elEstado = document.getElementById('estado');
const elDetalle = document.getElementById('detalle');
const elHerramienta = document.getElementById('herramienta');
const elLog = document.getElementById('log');

let timeoutEspera = null;

function reloj() {
  const ahora = new Date();
  document.getElementById('reloj').textContent =
    ahora.toLocaleDateString('es-CL') + '  ' + ahora.toLocaleTimeString('es-CL');
}
setInterval(reloj, 1000);
reloj();

function ponEstado(clase, texto) {
  body.className = clase;
  elEstado.className = clase;
  elEstado.textContent = texto;
}

function agregarLog(texto) {
  const linea = document.createElement('div');
  const hora = new Date().toLocaleTimeString('es-CL');
  linea.textContent = `${hora}  ${texto}`;
  elLog.prepend(linea);
  while (elLog.children.length > 8) elLog.removeChild(elLog.lastChild);
}

function reprogramarEspera() {
  clearTimeout(timeoutEspera);
  timeoutEspera = setTimeout(() => {
    ponEstado('espera', 'EN ESPERA');
    elHerramienta.textContent = '';
  }, 12000);
}

function conectar() {
  const es = new EventSource(`/maximus/eventos?token=${encodeURIComponent(token)}`);

  es.onopen = () => { elDetalle.textContent = 'Esperando actividad de Maximus…'; };

  es.onerror = () => {
    ponEstado('offline', 'SIN CONEXIÓN');
    elDetalle.textContent = 'Reintentando…';
  };

  es.onmessage = (ev) => {
    let datos;
    try { datos = JSON.parse(ev.data); } catch (e) { return; }
    if (datos.tipo === 'conectado') return;

    reprogramarEspera();

    if (datos.tipo === 'escuchando') {
      ponEstado('escuchando', 'ESCUCHANDO');
      elDetalle.textContent = `"${datos.mensaje}"`;
      elHerramienta.textContent = '';
      agregarLog(`Mensaje recibido (${datos.canal || ''}): ${datos.mensaje}`);
    } else if (datos.tipo === 'pensando') {
      ponEstado('pensando', 'PENSANDO');
      elHerramienta.textContent = '';
    } else if (datos.tipo === 'ejecutando') {
      ponEstado('ejecutando', 'EJECUTANDO');
      elHerramienta.textContent = `⚙ ${datos.herramienta}`;
      agregarLog(`Usando herramienta: ${datos.herramienta}`);
    } else if (datos.tipo === 'respondiendo') {
      ponEstado('respondiendo', 'RESPONDIENDO');
      elDetalle.textContent = datos.texto;
      elHerramienta.textContent = '';
      agregarLog(`Respuesta: ${datos.texto.slice(0, 80)}`);
    } else if (datos.tipo === 'hablando') {
      reproducirAudio(datos.audio_b64);
      agregarLog('Maximus está hablando');
    }
  };
}

// Reproduce el audio de la respuesta y anima el avatar según el volumen
// REAL del audio en cada instante -- no es sincronía labial de verdad
// (eso necesitaría un modelo de animación facial), es una aproximación
// honesta: el avatar "vibra" más fuerte cuando el audio suena más fuerte.
let audioCtx = null;
function reproducirAudio(base64) {
  try {
    const bytes = atob(base64);
    const buf = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
    const blob = new Blob([buf], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const fuente = audioCtx.createMediaElementSource(audio);
    const analizador = audioCtx.createAnalyser();
    analizador.fftSize = 256;
    fuente.connect(analizador);
    analizador.connect(audioCtx.destination);
    const datosFrecuencia = new Uint8Array(analizador.frequencyBinCount);

    ponEstado('hablando', 'HABLANDO');
    clearTimeout(timeoutEspera);

    let animando = true;
    function cuadro() {
      if (!animando) return;
      analizador.getByteFrequencyData(datosFrecuencia);
      const promedio = datosFrecuencia.reduce((a, b) => a + b, 0) / datosFrecuencia.length;
      const escala = 1 + Math.min(promedio / 255, 1) * 0.08;
      document.getElementById('foto').style.transform = `scale(${escala})`;
      requestAnimationFrame(cuadro);
    }
    cuadro();

    audio.onended = () => {
      animando = false;
      document.getElementById('foto').style.transform = 'scale(1)';
      URL.revokeObjectURL(url);
      reprogramarEspera();
      ponEstado('espera', 'EN ESPERA');
    };
    audio.play().catch((e) => {
      // Autoplay bloqueado por el navegador hasta el primer clic de la
      // pantalla -- pasa en TVs/tablets si nadie tocó la pantalla todavía.
      elDetalle.textContent = 'Toca la pantalla una vez para habilitar el audio.';
      console.warn('No se pudo reproducir el audio automáticamente:', e);
    });
  } catch (e) {
    console.error('Error reproduciendo audio:', e);
  }
}
document.body.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

// Botón de micrófono: habla acá, Maximus responde SOLO con audio -- no
// muestra su respuesta escrita, solo lo que tú dijiste (transcrito en el
// navegador, sin pasar audio crudo por el servidor).
const btnMic = document.getElementById('btnMic');
const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!Reconocedor) {
  btnMic.disabled = true;
  btnMic.title = 'Este navegador no soporta reconocimiento de voz';
  btnMic.style.opacity = '.3';
} else {
  const reconocimiento = new Reconocedor();
  reconocimiento.lang = 'es-CL';
  reconocimiento.continuous = false;
  reconocimiento.interimResults = false;

  let grabando = false;

  btnMic.addEventListener('click', () => {
    if (grabando) { reconocimiento.stop(); return; }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    reconocimiento.start();
  });

  reconocimiento.onstart = () => {
    grabando = true;
    btnMic.classList.add('grabando');
    elDetalle.textContent = 'Escuchando…';
  };

  reconocimiento.onerror = (ev) => {
    console.warn('Reconocimiento de voz falló:', ev.error);
    elDetalle.textContent = 'No entendí, intenta de nuevo.';
  };

  reconocimiento.onend = () => {
    grabando = false;
    btnMic.classList.remove('grabando');
  };

  reconocimiento.onresult = async (ev) => {
    const texto = ev.results[0][0].transcript;
    elDetalle.textContent = `"${texto}"`;
    ponEstado('pensando', 'PENSANDO');
    agregarLog(`Dijiste: ${texto}`);

    try {
      const r = await fetch('/maximus/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-maximus-token': token },
        body: JSON.stringify({ mensaje: texto, voz: true, sesion: 'display' }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const datos = await r.json();
      if (datos.audio) {
        reproducirAudio(datos.audio);
      } else {
        ponEstado('espera', 'EN ESPERA');
        elDetalle.textContent = 'No se pudo generar el audio de la respuesta.';
      }
    } catch (e) {
      console.error('Error hablando con Maximus:', e);
      ponEstado('espera', 'EN ESPERA');
      elDetalle.textContent = 'No pude conectar con Maximus.';
    }
  };
}

conectar();
</script>
</body>
</html>
